name: Book Shelter

on:
  schedule:
    - cron: '41 22 27 11 *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test run only (checks everything but does not submit)'
        type: boolean
        default: true
      timed_test:
        description: 'Timed test: simulate a target N minutes from now and watch the real wait/poll logic (still never submits)'
        type: boolean
        default: false
      test_target_minutes:
        description: 'Timed test only: minutes from now to simulate as the target'
        type: string
        default: '5'

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run booking agent
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          TIMED_TEST: ${{ github.event.inputs.timed_test }}
          TEST_TARGET_MINUTES: ${{ github.event.inputs.test_target_minutes }}
        run: python book_shelter.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots
          path: "*.png"
          if-no-files-found: ignore
